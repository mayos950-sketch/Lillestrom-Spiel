<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#76c9ee"><title>Lillestrøm Kommune – Vannkanon 2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7fd3f5;touch-action:none;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="game"></canvas><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d');let W=960,H=540,dpr=1,last=0,level=1,score=0,shots=[],enemies=[],bits=[],aim={x:700,y:270},down=false,clock=0,cool=0,shake=0,won=false,spawnTimer=0;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);c.width=innerWidth*dpr;c.height=innerHeight*dpr;g.setTransform(c.width/960,0,0,c.height/540,0,0)}addEventListener('resize',resize);resize();function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*960,y:(e.clientY-r.top)/r.height*540}}c.addEventListener('pointerdown',e=>{const p=pos(e);if(won){level++;setup();return}aim=p;down=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(down)aim=pos(e)});c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);
function setup(){enemies=[];shots=[];bits=[];won=false;for(let i=0;i<Math.min(4+level,11);i++){const row=Math.floor(i/4),col=i%4;enemies.push({x:575+col*88+row*12,y:318-row*89,baseY:318-row*89,vy:0,vx:0,alive:true,fall:false,phase:R(0,7),type:i%3,hp:1})}}setup();
function rr(x,y,w,h,r,fill,stroke,lw=2){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}function txt(t,x,y,size,color='#fff',align='left',weight=900){g.font=`${weight} ${size}px system-ui`;g.textAlign=align;g.lineJoin='round';g.lineWidth=4;g.strokeStyle='#26435c';g.strokeText(t,x,y);g.fillStyle=color;g.fillText(t,x,y)}function poly(points,color,stroke){g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=3;g.stroke()}}function ellipse(x,y,rx,ry,color){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=color;g.fill()}
function background(){let sky=g.createLinearGradient(0,0,0,440);sky.addColorStop(0,'#6cc6fa');sky.addColorStop(1,'#dcf5ff');g.fillStyle=sky;g.fillRect(0,0,960,540);ellipse(790,80,49,49,'#fff2a0');for(let i=0;i<6;i++){let x=(i*207+clock*3)%1250-150,y=62+(i%3)*43;ellipse(x,y,60,18,'#f6ffff');ellipse(x+28,y-11,38,23,'#f6ffff')}poly([[0,312],[115,254],[223,300],[346,244],[488,297],[621,257],[960,308],[960,540],[0,540]],'#83bcb2');poly([[0,353],[142,306],[293,341],[475,298],[648,333],[833,292],[960,322],[960,540],[0,540]],'#5caa8c');for(let i=0;i<12;i++){let x=i*93-20;rr(x,288+(i%3)*12,63,65,'4','#e7b99c','#a77867');poly([[x-7,290+(i%3)*12],[x+31,264+(i%3)*12],[x+71,290+(i%3)*12]],'#c76562');rr(x+23,317+(i%3)*12,18,24,2,'#a6e2f2')}g.fillStyle='#a3db74';g.fillRect(0,388,960,152);poly([[0,405],[960,405],[960,540],[0,540]],'#7ac55c');for(let i=0;i<22;i++){let x=i*49;ellipse(x,411+(i%3)*3,35,10,'#65ad4b')}g.fillStyle='#85b5cb';g.fillRect(0,452,960,88);g.fillStyle='#b5e4ec';g.fillRect(0,460,960,14);rr(0,405,960,15,2,'#c9a77b','#84664b');}
function platform(x,y,w){poly([[x,y],[x+w,y],[x+w-12,y+17],[x+12,y+17]],'#d3a05b','#79502f');rr(x+13,y+16,13,54,2,'#986339','#68482f');rr(x+w-25,y+16,13,54,2,'#986339','#68482f');rr(x+6,y-10,w-12,12,3,'#f2c47b','#8d623d')}
function character(e){if(!e.alive)return;const x=e.x,y=e.y+Math.sin(clock*2+e.phase)*2;g.save();g.translate(x,y);g.rotate(e.fall?C(e.vx/110,-1,1):0);ellipse(0,29,25,7,'#467c5388');rr(-18,-2,36,32,7,e.type===0?'#d99c4e':e.type===1?'#79b39c':'#c28fc6','#4e5461',3);rr(-15,0,30,10,4,'#f6e6ae');rr(-21,20,15,14,3,'#514a54');rr(6,20,15,14,3,'#514a54');rr(-28,0,11,20,5,'#d6a86b');rr(17,0,11,20,5,'#d6a86b');rr(-20,-35,40,35,12,'#f3c58f','#805d49',3);ellipse(-8,-20,3,4,'#283845');ellipse(9,-20,3,4,'#283845');rr(-6,-11,15,4,2,'#8c564b');poly([[-25,-33],[-18,-49],[18,-49],[26,-33]],e.type===0?'#f3b23d':e.type===1?'#61b88e':'#aa73c3','#624b3b');rr(-25,-36,50,9,3,'#e9d05f','#69553c');g.restore()}
function cannon(){const ox=139,oy=353;ellipse(ox,407,94,18,'#4c8359');rr(75,337,105,65,18,'#17668e','#103e58',5);rr(82,344,90,15,6,'#58b9dd');for(let x of [91,161]){ellipse(x,399,25,25,'#213e52');ellipse(x,399,12,12,'#8caab5')}let a=Math.atan2(aim.y-oy,aim.x-ox),len=100;g.save();g.translate(ox,oy);g.rotate(C(a,-1.25,0.6));rr(0,-17,len,34,13,'#2477a1','#16405e',5);rr(45,-14,53,9,4,'#67d9ed');rr(88,-23,21,46,7,'#1b526d','#0f354a',4);g.restore();ellipse(ox,oy,31,31,'#173e5a');ellipse(ox,oy,19,19,'#48a9d0');rr(90,300,60,40,8,'#f0c64b','#695b35',4);txt('VANN',120,327,14,'#234e5c','center');}
function splash(x,y,n=13){for(let i=0;i<n;i++){let a=R(0,Math.PI*2),v=R(60,270);bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:R(.35,.8),r:R(3,10),color:i%3?'#5be5ff':'#ffffff'})}shake=5}
function update(dt){clock+=dt;cool-=dt;shake*=Math.pow(.05,dt);if(down&&!won&&cool<=0){let dx=aim.x-139,dy=aim.y-353,l=Math.hypot(dx,dy)||1;shots.push({x:139,y:353,vx:dx/l*700,vy:dy/l*700,r:11});cool=.105}for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;for(const e of enemies){if(e.alive&&Math.hypot(s.x-e.x,s.y-(e.y-14))<33){e.alive=false;s.dead=true;score+=100;splash(e.x,e.y-15,23);break}}if(s.x>1010||s.y<0||s.y>550)s.dead=true}shots=shots.filter(s=>!s.dead);for(const b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=450*dt;b.life-=dt}bits=bits.filter(b=>b.life>0);if(!won&&enemies.every(e=>!e.alive)){won=true;down=false}}
function render(){g.save();g.translate(R(-shake,shake),R(-shake,shake));background();platform(550,358,380);platform(560,269,360);platform(570,181,350);for(const e of enemies)character(e);cannon();for(const s of shots){ellipse(s.x,s.y,15,12,'#d6fbff');ellipse(s.x-3,s.y-2,9,7,'#55d9f9')}for(const b of bits){g.globalAlpha=C(b.life*2,0,1);ellipse(b.x,b.y,b.r,b.r,b.color)}g.globalAlpha=1;g.restore();rr(16,15,350,61,16,'#183e62e8','#9deaff',3);txt('LILLESTRØM KOMMUNE',30,43,23,'#fff');txt('VANN  •  AVLØP  •  VEI  •  PARK',30,65,13,'#c7f7ff');rr(725,17,220,55,15,'#173b5be8','#a9edff',3);txt('LEVEL '+level,741,43,20);txt('★ '+score,741,63,15,'#ffdc72');rr(18,483,310,43,13,'#163e5ddf','#a7efff',2);txt('FINGER HALTEN = SCHIESSEN',32,511,17);if(won){g.fillStyle='#143955ad';g.fillRect(0,0,960,540);rr(265,160,430,180,23,'#fff4d2','#d39c47',6);txt('LEVEL GESCHAFFT!',480,222,35,'#f4b342','center');txt('TIPPE FÜR LEVEL '+(level+1),480,277,23,'#67cce9','center')}}function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
