<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#91d9f4"><title>Lillestrøm Kommune – Volley V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91d9f4;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:fixed;bottom:5px;left:0;right:0;text-align:center;color:#fff;font-size:11px;font-weight:900;text-shadow:0 2px 4px #134;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hint">Finger ziehen zum Zielen · Loslassen zum Schießen · Querformat empfohlen</div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d');let w=1000,h=560,scale=1,ox=0,oy=0;function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;scale=Math.min(c.width/w,c.height/h);ox=(c.width-w*scale)/2;oy=(c.height-h*scale)/2;}addEventListener('resize',resize);resize();const R=(a,b)=>a+Math.random()*(b-a);let level=1,phase='player',turn=1,aiming=false,angle=-.62,power=1,projectile=null,particles=[],messages=[],cameraShake=0,clock=0,player={x:166,y:373,hp:100},enemies=[];const ground=455;function reset(){player.hp=100;turn=1;phase='player';projectile=null;enemies=[{x:690,y:ground-40,hp:60,max:60},{x:790,y:ground-40,hp:60,max:60},{x:880,y:ground-40,hp:60,max:60}].slice(0,Math.min(3,1+Math.ceil(level/2)));messages=[];}reset();function text(t,x,y,size=20,color='#fff',align='center'){g.textAlign=align;g.font=`900 ${size}px system-ui`;g.lineWidth=4;g.strokeStyle='#214b66';g.strokeText(t,x,y);g.fillStyle=color;g.fillText(t,x,y)}function rect(x,y,w,h,color,r=0){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function line(x,y,x2,y2,width,color){g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}function cloud(x,y,s){ellipse(x,y,55*s,17*s,'#fff');ellipse(x-24*s,y-12*s,26*s,22*s,'#fff');ellipse(x+12*s,y-19*s,33*s,27*s,'#fff')}
function scenery(){let sky=g.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#69c7f6');sky.addColorStop(1,'#dbf7ff');rect(0,0,w,h,sky);ellipse(845,85,45,45,'#ffe89c');cloud(180,100,1.1);cloud(535,83,.75);cloud(875,147,.7);g.fillStyle='#9ac9d6';g.beginPath();g.moveTo(0,ground);for(let x=0;x<=w;x+=20)g.lineTo(x,315+25*Math.sin(x*.009)+13*Math.sin(x*.024));g.lineTo(w,ground);g.fill();for(let i=0;i<9;i++){let x=40+i*125;rect(x,315+(i%3)*17,76,130,'#c9dbe1',6);for(let j=0;j<3;j++)rect(x+13+j*20,340+(i%3)*17,12,21,'#83b5c6',2)}rect(0,ground,w,h-ground,'#73bc66');rect(0,ground+18,w,h-ground-18,'#4b9952');for(let x=0;x<w;x+=35){ellipse(x+10,ground+7,22,7,'#87cb72');ellipse(x+R(0,15),ground+55,12,4,'#63ad59')}for(let i=0;i<5;i++){let x=340+i*118;line(x,ground-18,x,ground-80,12,'#7e6146');ellipse(x,ground-96,35,38,'#4f9b5b');ellipse(x-20,ground-103,24,28,'#64b26c');ellipse(x+19,ground-106,24,28,'#79c476')}rect(0,ground-8,w,12,'#a2dc7e')}
function platform(x,y,width=115){rect(x-width/2,y,width,16,'#8b6045',4);rect(x-width/2,y,width,6,'#cf9866',3);rect(x-width/2+12,y+16,13,ground-y-16,'#82614c',3);rect(x+width/2-25,y+16,13,ground-y-16,'#82614c',3)}
function worker(x,y,enemy=false,hp=100){g.save();g.translate(x,y);ellipse(0,46,31,9,'#31674466');line(-12,17,-15,42,14,enemy?'#614e50':'#2c567f');line(11,17,14,42,14,enemy?'#614e50':'#2c567f');rect(-24,-25,48,52,enemy?'#bd6450':'#2c82b8',10);rect(-18,-20,36,35,enemy?'#e18c60':'#ffd45a',6);line(-21,-11,-31,10,12,enemy?'#b96754':'#2c82b8');line(22,-10,33,8,12,enemy?'#b96754':'#2c82b8');ellipse(0,-46,24,27,'#f0b982');ellipse(-8,-49,3,4,'#2c3442');ellipse(9,-49,3,4,'#2c3442');g.strokeStyle='#6b4736';g.lineWidth=2;g.beginPath();g.arc(0,-39,8,0,Math.PI);g.stroke();rect(-27,-69,54,17,enemy?'#a84236':'#f1ca28',7);rect(-20,-78,40,14,enemy?'#d35d45':'#ffdf45',7);rect(-10,-27,20,9,enemy?'#f4d09c':'#e9f4ff',2);g.restore();rect(x-30,y-93,60,8,'#4d5b68',5);rect(x-30,y-93,60*Math.max(0,hp)/(enemy?60:100),8,enemy?'#ff7058':'#5beb86',5)}
function gun(x,y,a){g.save();g.translate(x,y);g.rotate(a);rect(-8,-13,65,26,'#254d6b',8);rect(9,-10,54,20,'#55d4ec',6);rect(50,-17,19,34,'#176a8f',6);ellipse(70,0,8,15,'#183c58');rect(-12,7,14,30,'#35556a',3);g.restore()}
function hud(){rect(20,16,440,63,'#1c4c70dd',15);text('LILLESTRØM KOMMUNE',240,42,24,'#fff');text('VANN  💧   AVLØP   VEI   PARK',240,64,14,'#bdeefa');rect(772,16,207,64,'#1c4c70dd',14);text('LEVEL '+level,875,43,23,'#ffe275');text('RUNDE '+turn,875,66,15);rect(355,90,290,48,phase==='player'?'#2078ad':'#bc644e',16);text(phase==='player'?'DEIN SCHUSS!':phase==='enemy'?'GEGNER SCHIESST!':phase==='flight'?'TREFFER?':phase==='win'?'GEWONNEN!':'VERLOREN!',500,122,23);if(phase==='win'||phase==='lose'){rect(300,180,400,110,'#123d62ed',22);text(phase==='win'?'LEVEL GESCHAFFT!':'NOCH EIN VERSUCH!',500,227,27,'#ffdf72');text('Tippen zum Weiterspielen',500,263,19)}}
function puff(x,y,color,count=16){for(let i=0;i<count;i++){let a=R(0,Math.PI*2),v=R(2,8);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:R(25,48),color,r:R(3,9)})}}function shoot(fromPlayer){let x=fromPlayer?player.x+68:enemies.find(e=>e.hp>0)?.x-24,y=fromPlayer?player.y-6:ground-97;if(x===undefined)return;let a=fromPlayer?angle:Math.PI+R(.38,.8),v=fromPlayer?16*power:13;projectile={x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,owner:fromPlayer?'player':'enemy',trail:[]};phase='flight';puff(x,y,'#a8f4ff',12)}function next(){if(enemies.every(e=>e.hp<=0)){phase='win';return}if(player.hp<=0){phase='lose';return}if(projectile?.owner==='player'){phase='enemy';setTimeout(()=>{if(phase==='enemy')shoot(false)},750)}else{phase='player';turn++}projectile=null}
function update(){clock++;if(projectile){let p=projectile;for(let i=0;i<2;i++){p.x+=p.vx/2;p.y+=p.vy/2;p.vy+=.19;p.trail.push({x:p.x,y:p.y});if(p.trail.length>18)p.trail.shift();if(p.owner==='player'){for(const e of enemies){if(e.hp>0&&Math.abs(p.x-e.x)<36&&Math.abs(p.y-(e.y-22))<68){e.hp=Math.max(0,e.hp-60);puff(p.x,p.y,'#b8faff',32);cameraShake=12;next();break}}}else if(Math.abs(p.x-player.x)<42&&Math.abs(p.y-(player.y-20))<65){player.hp=Math.max(0,player.hp-24);puff(p.x,p.y,'#f4a065',25);cameraShake=12;next()}if(!projectile)break;if(p.y>ground||p.x>w+30||p.x<0){puff(Math.max(0,Math.min(w,p.x)),Math.min(ground,p.y),'#b8faff',20);next();break}}}particles=particles.filter(p=>p.life-->0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.vx*=.98}cameraShake*=.83}
function render(){g.setTransform(1,0,0,1,0,0);g.fillStyle='#78d0f0';g.fillRect(0,0,c.width,c.height);g.setTransform(scale,0,0,scale,ox,oy);g.save();if(cameraShake>1)g.translate(R(-cameraShake,cameraShake),R(-cameraShake,cameraShake));scenery();platform(170,420,200);enemies.forEach(e=>{platform(e.x,ground-5,100);if(e.hp>0)worker(e.x,e.y,true,e.hp);else{ellipse(e.x,ground-5,28,8,'#6a715a');text('💦',e.x,ground-18,25)}});worker(player.x,player.y,false,player.hp);gun(player.x+16,player.y-11,angle);if(phase==='player'){let x=player.x+75,y=player.y-12,vx=Math.cos(angle)*16*power,vy=Math.sin(angle)*16*power;for(let t=2;t<55;t+=3){let px=x+vx*t,py=y+vy*t+.19*t*t;ellipse(px,py,Math.max(2,5-t*.06),Math.max(2,5-t*.06),'#ffffffb0');if(py>ground)break}if(aiming){text('ZIELEN & LOSLASSEN',500,175,17,'#fff')}}if(projectile){projectile.trail.forEach((p,i)=>ellipse(p.x,p.y,3+i*.22,3+i*.22,'#ddfaff88'));ellipse(projectile.x,projectile.y,16,16,projectile.owner==='player'?'#a7f7ff':'#ffab4d');ellipse(projectile.x-4,projectile.y-5,6,6,'#fff')}particles.forEach(p=>ellipse(p.x,p.y,p.r,p.r,p.color));g.restore();hud();requestAnimationFrame(loop)}function loop(){update();render()}requestAnimationFrame(loop);
function pos(ev){let r=c.getBoundingClientRect();return{x:((ev.clientX-r.left)*devicePixelRatio-ox)/scale,y:((ev.clientY-r.top)*devicePixelRatio-oy)/scale}}function setAim(ev){let p=pos(ev),dx=p.x-(player.x+35),dy=p.y-(player.y-12);angle=Math.max(-1.5,Math.min(-.08,Math.atan2(dy,Math.max(50,dx))));power=Math.max(.75,Math.min(1.4,Math.hypot(dx,dy)/400))}c.addEventListener('pointerdown',e=>{e.preventDefault();if(phase==='win'||phase==='lose'){if(phase==='win')level++;reset();return}if(phase!=='player')return;aiming=true;c.setPointerCapture(e.pointerId);setAim(e)});c.addEventListener('pointermove',e=>{if(aiming)setAim(e)});c.addEventListener('pointerup',e=>{if(aiming&&phase==='player'){setAim(e);aiming=false;shoot(true)}});})();
</script></body></html>
