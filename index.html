<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#70c4e9"><title>Lillestrøm Kommune Battle V4</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c9eb;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;border:2px solid #fff9;border-radius:14px;background:linear-gradient(#ffe985,#ffa925);box-shadow:0 5px 0 #9a5d1d;color:#3a2818;font-weight:1000;padding:10px 14px;font-size:14px}#tabs{position:absolute;top:max(7px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:5px}#tabs button{padding:7px 11px;font-size:12px;background:linear-gradient(#effaff,#a9d2e8);box-shadow:0 3px 0 #52768d}#tabs button.active{background:linear-gradient(#ffe87e,#ff9f22)}#restart{position:absolute;right:10px;bottom:max(12px,env(safe-area-inset-bottom))}#help{position:absolute;left:12px;bottom:12px;color:white;text-shadow:1px 2px 3px #173f58;font-size:12px;font-weight:800;max-width:65%}@media(max-width:600px){#tabs button{padding:6px 8px;font-size:11px}#help{font-size:10px}}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="tabs"><button data-team="0" class="active">💧 VANN</button><button data-team="1">🟤 AVLØP</button><button data-team="2">🚧 VEI</button><button data-team="3">🌳 PARK</button></div><div id="help">Dra fingeren for å sikte · Slipp for å skyte</div><button id="restart">↻ NY RUNDE</button></div><script>
(()=>{'use strict';const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');let W=1000,H=560,dpr=1,team=0,round=1,turn='player',phase='aim',projectile=null,aim={x:630,y:245},drag=false,particles=[],debris=[],enemyShots=0,shake=0,notice='DIN TUR!',noticeTime=1.8,clock=0,wind=0,score=0;const teams=[{name:'VANN',main:'#158ad5',dark:'#13558e',ammo:'#71e8ff',enemy:'AVLØP',emoji:'💧'},{name:'AVLØP',main:'#a87c40',dark:'#67431f',ammo:'#694626',enemy:'VEI',emoji:'🟤'},{name:'VEI',main:'#f5a92d',dark:'#a66216',ammo:'#404850',enemy:'PARK',emoji:'🚧'},{name:'PARK',main:'#3cb75b',dark:'#16753a',ammo:'#8ae047',enemy:'VANN',emoji:'🌳'}];let targets=[];const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.min(b,Math.max(a,n));function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}addEventListener('resize',resize);resize();function reset(){targets=[{x:690,y:354,hp:2,max:2,alive:true,fall:0,hat:0},{x:800,y:318,hp:2,max:2,alive:true,fall:0,hat:0},{x:894,y:377,hp:1,max:1,alive:true,fall:0,hat:0}];particles=[];debris=[];projectile=null;turn='player';phase='aim';notice='DIN TUR!';noticeTime=1.5;shake=0;enemyShots=0;wind=rand(-12,12)}function choose(n){team=n;document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('active',i===team));round=1;score=0;reset()}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>choose(+b.dataset.team));document.querySelector('#restart').onclick=()=>{round=1;score=0;reset()};function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function line(x,y,x2,y2,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}function txt(s,x,y,size=22,c='#fff',align='center'){ctx.font=`1000 ${size}px system-ui`;ctx.textAlign=align;ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='#23465c';ctx.strokeText(s,x,y);ctx.fillStyle=c;ctx.fillText(s,x,y)}function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill()}function background(){let g=ctx.createLinearGradient(0,0,0,480);g.addColorStop(0,'#5db5e8');g.addColorStop(.72,'#d0f4fa');g.addColorStop(1,'#f8f2c3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ellipse(815,105,52,52,'#ffe99a');for(let i=0;i<6;i++){let x=i*220-80;ellipse(x+30,100+(i%2)*30,65,19,'#ffffffc9');ellipse(x+80,95+(i%2)*30,54,25,'#ffffffc9')}polygon([[0,320],[180,250],[320,314],[460,254],[650,320],[830,267],[1000,320],[1000,540],[0,540]],'#7ac69c');polygon([[0,373],[150,318],[300,358],[475,310],[660,359],[850,315],[1000,359],[1000,540],[0,540]],'#56ac7d');for(let i=0;i<8;i++){let x=100+i*122;rounded(x,296+(i%3)*17,60,92,4,i%2?'#e7b47f':'#e5d9bd');polygon([[x-7,299+(i%3)*17],[x+30,271+(i%3)*17],[x+69,299+(i%3)*17]],'#a96b5a');for(let j=0;j<2;j++)rounded(x+12+j*27,319+(i%3)*17,14,19,2,'#a2d8e8')}rounded(0,429,1000,131,0,'#88bd6c');rounded(0,476,1000,84,0,'#6ca352');for(let i=0;i<14;i++){let x=i*83+20;line(x,431,x,392,'#795838',7);ellipse(x,385,25,33,i%2?'#378c50':'#4ca965')}polygon([[0,485],[1000,485],[1000,560],[0,560]],'#759d57');for(let i=0;i<20;i++)ellipse(i*56+20,502+(i%3)*13,3,3,'#d9e89e')}
function platforms(){rounded(54,442,285,33,8,'#475a66');rounded(54,434,285,17,7,'#c7b18b');for(let i=0;i<5;i++)rounded(69+i*55,453,40,7,2,'#7a6e64');[[643,391,119],[755,356,119],[850,414,130]].forEach(([x,y,w],i)=>{rounded(x+14,y+13,12,475-y,3,'#6b5d53');rounded(x+w-23,y+13,12,475-y,3,'#6b5d53');rounded(x,y,w,23,5,'#6d5d4d');rounded(x,y-9,w,17,4,'#d7a56c');for(let j=0;j<3;j++)line(x+20+j*34,y-6,x+38+j*34,y+5,'#b17a46',3)})}
function worker(x,y,kind,enemy=false,dead=false,hatOffset=0){ctx.save();ctx.translate(x,y);if(dead){ctx.rotate(.85)}let t=teams[kind];ellipse(0,5,34,9,'#223b4380');line(-13,-28,-17,0,'#26394c',16);line(12,-28,17,0,'#26394c',16);rounded(-29,-6,26,12,4,'#242e3c');rounded(5,-6,29,12,4,'#242e3c');rounded(-26,-92,52,68,13,t.main);rounded(-20,-84,40,43,6,t.dark);line(-26,-80,-40,-47,'#e4b58e',14);line(24,-80,35,-49,'#e4b58e',14);ellipse(0,-110,30,33,'#f4c39b');ellipse(-10,-113,5,7,'#ffffff');ellipse(11,-113,5,7,'#ffffff');ellipse(-8,-113,2.8,4,'#263440');ellipse(13,-113,2.8,4,'#263440');line(-13,-126,-3,-123,'#533f34',4);line(7,-124,18,-128,'#533f34',4);ellipse(3,-99,9,4,'#b86d65');ctx.save();ctx.translate(hatOffset,-2*hatOffset);polygon([[-33,-131],[-25,-151],[23,-151],[32,-131]],enemy?'#f7c344':'#ffdb54');rounded(-35,-136,69,10,5,enemy?'#d99028':'#f1a81c');ctx.restore();rounded(-16,-66,32,11,3,'#f3da73');txt(enemy?'!':t.emoji,-1,-48,18,'#fff');ctx.restore()}
function cannon(){ctx.save();ctx.translate(275,344);let angle=Math.atan2(aim.y-344,aim.x-275);angle=clamp(angle,-1.35,.3);ctx.rotate(angle);rounded(-7,-21,98,42,15,teams[team].dark);rounded(0,-16,91,30,11,teams[team].main);rounded(78,-26,25,50,7,'#243f50');rounded(89,-18,14,34,5,'#91cbdc');ctx.restore();ellipse(261,395,40,40,'#344a54');ellipse(261,395,26,26,'#b6c5ca');ellipse(261,395,10,10,'#526b76');worker(175,433,team)}
function targetDraw(t,i){if(t.alive)worker(t.x,t.y,i%4===0?(team+1)%4:(team+1+i)%4,true,false,t.hat);else if(t.fall<1.4){ctx.save();ctx.globalAlpha=1-t.fall/1.4;worker(t.x+50*t.fall,t.y+140*t.fall,(team+1+i)%4,true,true,20*t.fall);ctx.restore()}if(t.alive){rounded(t.x-30,t.y-173,60,10,5,'#542e33');rounded(t.x-28,t.y-171,56*(t.hp/t.max),6,4,'#70ec68')}}
function burst(x,y,color,n=25){shake=7;for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-210,210),vy:rand(-270,70),life:rand(.4,1.2),max:1.2,r:rand(3,11),color})}function fire(fromEnemy=false){if(projectile||phase==='flying')return;let x=fromEnemy?targets.filter(t=>t.alive)[0]?.x||790:340,y=fromEnemy?targets.filter(t=>t.alive)[0]?.y-90||260:338;let angle=fromEnemy?Math.atan2(360-y,175-x)+rand(-.12,.12):Math.atan2(aim.y-344,aim.x-275);angle=clamp(angle,fromEnemy?-3.3:-1.4,fromEnemy?-2.4:.3);let speed=fromEnemy?590:690;projectile={x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,fromEnemy,trail:[]};phase='flying';notice='';}
function advance(dt){clock+=dt;noticeTime-=dt;shake*=.88;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const t of targets)if(!t.alive)t.fall+=dt;if(projectile){let p=projectile;p.trail.push({x:p.x,y:p.y});if(p.trail.length>15)p.trail.shift();p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=570*dt;p.vx+=wind*dt;let hit=false;if(!p.fromEnemy){for(const t of targets){if(t.alive&&Math.abs(p.x-t.x)<46&&p.y>t.y-165&&p.y<t.y+6){t.hp--;burst(p.x,p.y,teams[team].ammo,38);if(t.hp<=0){t.alive=false;score+=100;burst(t.x,t.y-80,'#ffe39b',20)}hit=true;break}}}else if(p.x<310&&p.y>275&&p.y<470){burst(p.x,p.y,'#ffb654',45);hit=true}if(p.y>483||p.x>1040||p.x<0){burst(clamp(p.x,20,980),clamp(p.y,120,483),p.fromEnemy?'#ffa552':teams[team].ammo,24);hit=true}if(hit){let wasEnemy=p.fromEnemy;projectile=null;if(!wasEnemy){if(targets.every(t=>!t.alive)){phase='win';notice='SEIER! 🎉';noticeTime=2.2;setTimeout(()=>{round++;reset()},1900)}else{turn='enemy';phase='wait';notice='MOTSTANDERENS TUR!';noticeTime=1.6;setTimeout(()=>{if(turn==='enemy'&&phase==='wait')fire(true)},1100)}}else{turn='player';phase='aim';notice='DIN TUR!';noticeTime=1.3}}}}
}
function draw(){ctx.save();if(shake>1)ctx.translate(rand(-shake,shake),rand(-shake,shake));background();platforms();targets.forEach(targetDraw);cannon();if(projectile){for(let i=0;i<projectile.trail.length;i++){let p=projectile.trail[i];ellipse(p.x,p.y,4+i*.5,4+i*.5,projectile.fromEnemy?'#f6b25b':'#d6f8ff')}ellipse(projectile.x,projectile.y,17,17,projectile.fromEnemy?'#ef8e31':teams[team].ammo);ellipse(projectile.x-5,projectile.y-5,5,5,'#ffffffb5')}for(const p of particles){ctx.globalAlpha=clamp(p.life/.7,0,1);ellipse(p.x,p.y,p.r,p.r,p.color)}ctx.globalAlpha=1;if(drag&&phase==='aim'){line(315,341,aim.x,aim.y,'#ffffffb0',3);for(let i=1;i<=10;i++){let angle=Math.atan2(aim.y-344,aim.x-275),speed=690,t=i*.085;ellipse(340+Math.cos(angle)*speed*t,338+Math.sin(angle)*speed*t+285*t*t,4,4,'#ffffffa0')}}ctx.restore();rounded(15,17,285,62,14,'#163a55d9');txt('LILLESTRØM KOMMUNE',157,43,19,'#ffffff');txt('BATTLE  •  NIVÅ '+round,156,67,16,'#ffdf74');rounded(803,17,180,58,14,'#163a55d9');txt('POENG  '+score,893,52,20,'#ffe17e');if(noticeTime>0&&notice){rounded(346,98,309,61,18,'#1a4664dc');txt(notice,500,138,28,'#ffdf7a')}if(phase==='aim'){rounded(366,492,270,45,12,'#164d66c9');txt('🎯 SIKT OG SLIPP!',501,522,21,'#fff')}}let last=performance.now();function loop(now){let dt=Math.min((now-last)/1000,.032);last=now;advance(dt);draw();requestAnimationFrame(loop)}function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}canvas.addEventListener('pointerdown',e=>{if(phase!=='aim')return;drag=true;aim=point(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag&&phase==='aim')aim=point(e)});canvas.addEventListener('pointerup',e=>{if(drag&&phase==='aim'){aim=point(e);drag=false;fire()}});canvas.addEventListener('pointercancel',()=>drag=false);reset();requestAnimationFrame(loop)})();
</script></body></html>
