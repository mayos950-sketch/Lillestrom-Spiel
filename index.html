<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#53b8f5"><title>Lillestrøm Kommune – Vannkanon</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#74caff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#tip{position:fixed;bottom:env(safe-area-inset-bottom);left:0;right:0;text-align:center;color:white;text-shadow:0 2px 4px #123;pointer-events:none;font-weight:900;font-size:12px;padding-bottom:4px}</style></head><body><canvas id="g"></canvas><div id="tip">Finger halten = Wasserkanone feuert · Handy quer drehen für größere Ansicht</div><script>
(()=>{'use strict';const c=document.getElementById('g'),ctx=c.getContext('2d');let W=960,H=540,sx=1,sy=1,last=0,elapsed=0,score=0,health=5,level=1,over=false,paused=false,aim={x:650,y:270},firing=false,bullets=[],enemies=[],particles=[],splashes=[],spawn=0,shake=0,hitTime=0,shots=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;sx=c.width/W;sy=c.height/H}addEventListener('resize',resize);resize();function pointer(e){let r=c.getBoundingClientRect();aim.x=(e.clientX-r.left)/r.width*W;aim.y=(e.clientY-r.top)/r.height*H}c.addEventListener('pointerdown',e=>{pointer(e);if(over){reset();return}if(e.clientX/c.clientWidth>.91&&e.clientY/c.clientHeight<.18){paused=!paused;return}firing=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',pointer);c.addEventListener('pointerup',()=>firing=false);c.addEventListener('pointercancel',()=>firing=false);function reset(){score=0;health=5;level=1;over=false;paused=false;enemies=[];bullets=[];particles=[];spawn=0;elapsed=0}function puff(x,y,color,n=12,scale=1){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-160,160)*scale,vy:rand(-230,60)*scale,r:rand(2,7)*scale,life:rand(.3,.85),max:.85,color})}function enemy(){let size=rand(22,33),kind=Math.random();enemies.push({x:W+35,y:rand(210,408),vx:rand(36,65)+level*7,r:size,hp:level>3&&Math.random()<.35?3:2,bob:rand(0,6),kind,flash:0})}function shoot(){let ox=201,oy=356,dx=aim.x-ox,dy=aim.y-oy,l=Math.hypot(dx,dy)||1;bullets.push({x:ox,y:oy,vx:dx/l*790,vy:dy/l*790,life:1.3,r:9});shots++;puff(ox,oy,'#b5faff',3,.6)}function update(dt){if(over||paused)return;elapsed+=dt;level=1+Math.floor(score/140);spawn-=dt;if(spawn<=0){enemy();spawn=Math.max(.43,1.35-level*.07)*rand(.75,1.2)}if(firing){hitTime-=dt;if(hitTime<=0){shoot();hitTime=.105}}else hitTime=0;for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}for(const e of enemies){e.x-=e.vx*dt;e.bob+=dt*5;e.flash=Math.max(0,e.flash-dt);if(e.x<218){e.dead=true;health--;shake=7;puff(235,e.y,'#8b5c32',17);if(health<=0)over=true}for(const b of bullets){if(b.life<=0||e.dead)continue;let d=Math.hypot(e.x-b.x,e.y+Math.sin(e.bob)*5-b.y);if(d<e.r+b.r){b.life=0;e.hp--;e.flash=.12;puff(b.x,b.y,'#b5faff',7,.8);if(e.hp<=0){e.dead=true;score+=10;puff(e.x,e.y,'#79522c',23,1.2);puff(e.x,e.y,'#a8ecff',14,1);shake=3}}}}bullets=bullets.filter(b=>b.life>0&&b.x<W+20&&b.y>-20&&b.y<H+20);enemies=enemies.filter(e=>!e.dead);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-30*dt)}function roundRect(x,y,w,h,r,fill,stroke,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}function txt(t,x,y,size,color='#fff',stroke='#20394b',align='center'){ctx.font=`900 ${size}px system-ui`;ctx.textAlign=align;ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size/5);if(stroke){ctx.strokeStyle=stroke;ctx.strokeText(t,x,y)}ctx.fillStyle=color;ctx.fillText(t,x,y)}function cloud(x,y,sc){ctx.fillStyle='#fff';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(x+i*27*sc,y+Math.sin(i)*8*sc,27*sc,18*sc,0,0,7);ctx.fill()}}function tree(x,y,sc){ctx.strokeStyle='#785032';ctx.lineWidth=15*sc;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-80*sc);ctx.stroke();for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#398c43':'#4faa45';ctx.beginPath();ctx.arc(x+(i-2)*20*sc,y-(82+(i%2)*17)*sc,33*sc,0,7);ctx.fill()}}function bg(){let sky=ctx.createLinearGradient(0,0,0,440);sky.addColorStop(0,'#54b9ff');sky.addColorStop(1,'#d9f5ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);cloud(85,77,1.2);cloud(450,92,.9);cloud(740,65,1.1);ctx.fillStyle='#a6d8ac';ctx.beginPath();ctx.moveTo(0,318);for(let x=0;x<=W;x+=25)ctx.lineTo(x,286+Math.sin(x*.016)*26);ctx.lineTo(W,500);ctx.lineTo(0,500);ctx.fill();for(let i=0;i<12;i++)tree(i*93-10,385,.58+(i%3)*.12);ctx.fillStyle='#e7bd83';for(let i=0;i<7;i++){let x=315+i*82,h=randBuilding(i);ctx.fillRect(x,320-h,65,h);ctx.fillStyle='#a2d8ee';for(let j=0;j<3;j++)for(let k=0;k<3;k++)ctx.fillRect(x+10+j*18,325-h+k*22,11,13);ctx.fillStyle='#e7bd83'}ctx.fillStyle='#3c9c4b';ctx.fillRect(0,380,W,160);ctx.fillStyle='#a3aab1';ctx.beginPath();ctx.moveTo(0,460);ctx.lineTo(W,390);ctx.lineTo(W,540);ctx.lineTo(0,540);ctx.fill();ctx.strokeStyle='#f4f0d0';ctx.lineWidth=5;ctx.setLineDash([30,30]);ctx.beginPath();ctx.moveTo(240,490);ctx.lineTo(960,430);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#82ccfb';ctx.beginPath();ctx.moveTo(0,452);ctx.bezierCurveTo(190,428,340,510,530,480);ctx.lineTo(530,540);ctx.lineTo(0,540);ctx.fill();ctx.fillStyle='#8d6640';ctx.fillRect(0,405,235,135);ctx.fillStyle='#626d79';ctx.fillRect(0,398,235,18);for(let i=0;i<6;i++){ctx.fillStyle='#78848c';ctx.fillRect(i*42,400,37,12)}}function randBuilding(i){return 65+(i*37)%48}function cannon(){let a=Math.atan2(aim.y-356,aim.x-201);a=clamp(a,-1.35,1.2);ctx.save();ctx.translate(124,363);ctx.fillStyle='#283f52';ctx.beginPath();ctx.ellipse(0,37,61,24,0,0,7);ctx.fill();ctx.fillStyle='#2486c7';roundRect(-34,-33,71,75,18,'#247cbb','#163b5b',5);ctx.fillStyle='#f2c39b';ctx.beginPath();ctx.arc(0,-56,27,0,7);ctx.fill();roundRect(-30,-83,61,18,8,'#1688d7','#1e4b75',4);ctx.fillStyle='#0a4d80';roundRect(-20,-67,44,17,7,'#56c9ff','#1b3751',3);ctx.fillStyle='#55341f';ctx.beginPath();ctx.arc(4,-42,19,0,Math.PI);ctx.fill();ctx.save();ctx.translate(35,-7);ctx.rotate(a);roundRect(0,-19,80,38,10,'#7b93a8','#263b4b',6);roundRect(48,-24,30,48,7,'#b9d4e2','#294455',5);roundRect(70,-28,16,56,5,'#496c85','#263b4b',4);ctx.restore();ctx.fillStyle='#f4bb32';ctx.beginPath();ctx.arc(33,6,16,0,7);ctx.fill();ctx.restore()}function monster(e){let x=e.x,y=e.y+Math.sin(e.bob)*5,r=e.r;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(e.bob)*.08);ctx.fillStyle='#6c4d30';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle=e.flash?'#e3e9d0':'#8a653d';ctx.beginPath();ctx.arc(-5,-7,r*.86,0,7);ctx.fill();ctx.fillStyle='#fff';for(const dx of [-10,11]){ctx.beginPath();ctx.arc(dx,-6,9,0,7);ctx.fill();ctx.fillStyle='#192c20';ctx.beginPath();ctx.arc(dx+2,-5,4,0,7);ctx.fill();ctx.fillStyle='#fff'}ctx.fillStyle='#39221a';ctx.beginPath();ctx.ellipse(1,12,12,7,0,0,7);ctx.fill();ctx.fillStyle='#e97334';ctx.beginPath();ctx.moveTo(-17,-r+2);ctx.lineTo(0,-r-31);ctx.lineTo(18,-r+2);ctx.fill();ctx.fillStyle='#f3f4e9';ctx.fillRect(-11,-r-9,23,6);ctx.restore()}function hud(){roundRect(14,13,259,67,12,'#674225','#2a201a',5);txt('LILLESTRØM',145,43,26,'#ffcb42');txt('KOMMUNE',145,68,21,'#f2f8ff');roundRect(292,17,155,53,10,'#0874c4','#173f5e',4);txt('💧 VANN',369,52,23);roundRect(455,17,145,53,10,'#9c5b26','#54371f',4);txt('AVLØP',527,51,20);roundRect(608,17,145,53,10,'#4e555d','#202a31',4);txt('VEI',680,51,22);roundRect(761,17,110,53,10,'#4f9d27','#26531c',4);txt('PARK',816,51,22);roundRect(15,93,173,46,10,'#2a4966','#112c43',4);txt('LEVEL '+level,100,124,22);roundRect(205,93,176,46,10,'#2a4966','#112c43',4);txt('⭐ '+score,294,124,23);roundRect(396,93,162,46,10,'#2a4966','#112c43',4);txt('❤️ '+health,475,124,23);roundRect(884,16,59,55,10,'#9d6a30','#3a2b1e',4);txt(paused?'▶':'Ⅱ',913,55,32);roundRect(18,466,175,56,10,'#117ac1','#e5bc37',5);txt('💧 WASSER',104,504,21);roundRect(201,475,240,40,8,'#2b4e66','#162c3a',3);txt('ZIELEN & SCHIESSEN',321,502,16)}function draw(){ctx.setTransform(sx,0,0,sy,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(rand(-shake,shake),rand(-shake,shake));bg();for(const e of enemies)monster(e);for(const b of bullets){ctx.fillStyle='#d8faff';ctx.strokeStyle='#3bc0fa';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(b.x,b.y,b.r*1.4,b.r*.8,Math.atan2(b.vy,b.vx),0,7);ctx.fill();ctx.stroke()}for(const p of particles){ctx.globalAlpha=clamp(p.life/.65,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;cannon();ctx.restore();hud();if(over||paused){ctx.fillStyle='#142c45bb';ctx.fillRect(0,0,W,H);txt(over?'SPIEL VORBEI!':'PAUSE',480,220,55,'#ffcf47');txt(over?'Punkte: '+score:'Tippe oben rechts zum Fortsetzen',480,282,27);if(over)txt('Tippen zum Neustart',480,343,27)}}function loop(t){let dt=Math.min((t-last)/1000||.016,.045);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
